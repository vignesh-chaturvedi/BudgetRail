packages:
  - "apps/*"
  - "packages/*"

overrides:
  "nanoid@<3.3.17": "3.3.17"
  postcss: "8.5.26"
  sharp: "0.35.3"
  "uuid@<11.1.1": "11.1.1"

confirmModulesPurge: false

allowBuilds:
  bufferutil: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BudgetRail Agent</title>
  <desc id="desc">Two rails meeting a buffer stop, for an agent whose spending authority is capped, expiring, and revocable.</desc>
  <defs>
    <linearGradient id="brGrad" x1="4" y1="8" x2="27" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0B1120"/>
  <g transform="translate(64 64) scale(12)" fill="none" stroke="url(#brGrad)" stroke-width="3.4" stroke-linecap="round">
    <path d="M11 27 L7 13"/>
    <path d="M21 27 L25 13"/>
    <path d="M5 7 L27 7"/>
  </g>
</svg>
